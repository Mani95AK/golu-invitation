services:
  - type: web
    name: golu-invitation
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FAMILY_NAME
        value: The [Your Family Name] Family
      - key: EVENT_DATE
        value: "2026-10-18"
      - key: EVENT_TIME
        value: "18:00"
      - key: EVENT_TIMEZONE
        value: Asia/Kolkata
      - key: EVENT_TIME_DISPLAY
        value: 6:00 PM IST
      - key: ADDRESS
        value: 123 Example Street, Sample Neighbourhood, City 000000, Tamil Nadu, India
      - key: COUNTDOWN_ENABLED
        value: "true"
      - key: PUBLIC_URL
        sync: false
